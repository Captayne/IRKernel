name=IRKernel
version=2.1.0
author=Andreas Keibel
maintainer=Andreas Keibel <dr.andreas.keibel@googlemail.com>
sentence=Stackful cooperative multitasking with proportional-fair priority scheduling.
paragraph=Each task gets its own stack, so it can yield from anywhere and resume with local variables intact. Priorities determine the share of CPU time a task receives, not whether it preempts others, so nothing starves. Cyclic tasks give you a stable control-loop tick. Originally written in 1993 for a PC-based industrial robot controller at the Institute of Robotics Research, University of Dortmund; ported to small microcontrollers. Runs on AVR and ARM Cortex-M0/M0+/M3/M4/M33 without an RTOS.
